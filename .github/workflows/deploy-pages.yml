# Deploys web-summit.newsroom.sgit.ai (copied from the team site, SGit-AI__Website__Web-Summit) to GitHub Pages. CI owns the version
# (https://newsroom.sgit.ai/articles/ci-owns-the-version.html): nobody who pushes writes a number.
#
#   1. validate — builds the pushed commit (generated output is never committed) and runs
#                 newsroom/build/validate.js. A failure stops everything. Also runs on PRs, read-only.
#   2. release  — one at a time (concurrency group "release", never cancelled): newsroom/build/tag_release.sh
#                 takes the branch head as it is now, bumps the newest version (dev the last number,
#                 main the middle one), writes version.txt, the versions row and REALITY.md, builds,
#                 runs the gate again on that tree, commits as GitHub Actions ("site vX.Y.Z: <subject>"),
#                 tags it and pushes; then deploys exactly that tree. A dropped pending run is harmless:
#                 its commits ride the next release. A manual dispatch builds and deploys without a number.
#   3. deploy:    actions/deploy-pages waits at most 4 minutes (a deploy takes about 10 seconds). If Pages sticks in
#                 "syncing_files" (as v0.1.87's did on 6 November 2026, 03:21 to 03:30 UTC, until the job's timeout
#                 cancelled it while five pushes waited), the stuck deployment is cancelled and the same artifact is
#                 deployed once more; if that fails too, the job fails red rather than timing out. devops@PrompTugal.dinis,
#                 board/team/devops/health-2026-11-06.md.
name: deploy-pages
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # full history, blobless: tag_release.sh reads the tags
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and validate the site (the gate builds it once, check 9; generated output is never committed)
        run: node newsroom/build/validate.js

  release:
    runs-on: ubuntu-latest
    # tag and build about 30s, then up to two deploys of 4 minutes each (step 3 above)
    timeout-minutes: 12
    needs: [validate]
    # Never from a PR. One release at a time; a pending run may be dropped, which is harmless.
    if: github.event_name != 'pull_request'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.redeploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Number, build, check, commit and tag this release (CI owns the version)
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: newsroom/build/tag_release.sh
      - name: Build (a manual dispatch, no number)
        if: github.event_name != 'push'
        run: node newsroom/build/build.mjs && node newsroom/build/validate.js
      - name: Assemble the site artifact (the tree just built and checked)
        run: |
          mkdir -p /tmp/site
          rsync -a ./ /tmp/site/ --exclude '.git' --exclude '.github' --exclude '.sg_vault' --exclude 'content' --exclude 'newsroom/build' --exclude 'newsroom/tools' --exclude '.generated.txt'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 240000
      - name: The deploy failed or stuck; cancel that Pages deployment (it would block the retry)
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::the Pages deploy of ${GITHUB_SHA:0:9} failed or did not finish in 4 minutes; cancelling it and deploying once more"
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$GITHUB_SHA/cancel" >/dev/null || echo "nothing to cancel"
          sleep 5
      - id: redeploy
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 240000
