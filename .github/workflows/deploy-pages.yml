# Deploys web-summit.newsroom.sgit.ai (copied from the team site, SGit-AI__Website__Web-Summit) to GitHub Pages. CI owns the version
# (https://newsroom.sgit.ai/articles/ci-owns-the-version.html): nobody who pushes writes a number.
#
#   1. validate — builds the pushed commit (generated output is never committed) and runs
#                 newsroom/build/validate.js. A failure stops everything. Also runs on PRs, read-only.
#   2. release  — one at a time (concurrency group "release", never cancelled): newsroom/build/tag_release.sh
#                 takes the branch head as it is now, bumps the newest version (dev the last number,
#                 main the middle one), writes version.txt, the versions row and REALITY.md, builds,
#                 runs the gate again on that tree, commits as GitHub Actions ("site vX.Y.Z: <subject>"),
#                 tags it and pushes; then deploys exactly that tree. A dropped pending run is harmless:
#                 its commits ride the next release. A manual dispatch builds and deploys without a number.
#   3. deploy:    actions/deploy-pages waits at most 2 minutes (a good deploy takes 7 to 12 seconds) and cancels
#                 its own deployment when it gives up. Pages sometimes reports "syncing_files" for ever while the site
#                 already serves the new files (6 November 2026: v0.1.87 at 03:21, v0.1.93 at 03:44, v0.1.96 at
#                 03:57), or answers "cancelled" at once (v0.1.98 at 04:02). Pages names a deployment after the commit,
#                 so the same commit cannot be deployed again in this run. So when the deploy fails, the job asks the
#                 live site: if it serves this release's version, the deploy landed and the job passes with a warning;
#                 if not, it dispatches this workflow on the branch (a fresh deployment of its head, under the head's
#                 own commit) and fails red. A dispatched run never dispatches again. From 04:25 to 06:14 UTC Pages
#                 stuck five times in 60 runs, the live site never had the release (0 of 5), and each dispatched
#                 deploy went live in about 80 seconds; so the wait is 2 minutes and the live check 30 seconds.
#                 devops@PrompTugal.dinis, board/team/devops/health-2026-11-06.md.
name: deploy-pages
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # full history, blobless: tag_release.sh reads the tags
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and validate the site (the gate builds it once, check 9; generated output is never committed)
        run: node newsroom/build/validate.js

  release:
    runs-on: ubuntu-latest
    # tag and build about 30s, a deploy of at most 2 minutes, then 30 seconds asking the live site (step 3)
    timeout-minutes: 6
    needs: [validate]
    # Never from a PR. One release at a time; a pending run may be dropped, which is harmless.
    if: github.event_name != 'pull_request'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
      # only to dispatch a fresh deploy when Pages loses one (step 3)
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Number, build, check, commit and tag this release (CI owns the version)
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: newsroom/build/tag_release.sh
      - name: Build (a manual dispatch, no number)
        if: github.event_name != 'push'
        run: node newsroom/build/build.mjs && node newsroom/build/validate.js
      - name: Assemble the site artifact (the tree just built and checked)
        run: |
          mkdir -p /tmp/site
          rsync -a ./ /tmp/site/ --exclude '.git' --exclude '.github' --exclude '.sg_vault' --exclude 'content' --exclude 'newsroom/build' --exclude 'newsroom/tools' --exclude '.generated.txt'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 120000
      - name: The deploy failed or stuck; does the live site serve this release? If not, dispatch a fresh deploy
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          WANT=$(cat newsroom/build/version.txt); HOST=$(cat CNAME)
          echo "::warning::the Pages deploy of $WANT (${GITHUB_SHA:0:9}) failed or did not finish in 2 minutes; asking https://$HOST/ for it"
          for i in $(seq 1 3); do
            LIVE=$(curl -s --max-time 10 -H 'Cache-Control: no-cache' "https://$HOST/llms.txt?release=${GITHUB_SHA:0:9}-$i" | grep -o 'v[0-9]*\.[0-9]*\.[0-9]*' | head -1 || true)
            if [ -n "$LIVE" ] && [ "$(printf '%s\n%s\n' "$WANT" "$LIVE" | sort -V | tail -1)" = "$LIVE" ]; then
              echo "::warning::Pages never reported success, but $HOST serves $LIVE (at or after $WANT): the deploy landed"; exit 0
            fi
            sleep 10
          done
          echo "::error::$HOST still serves ${LIVE:-nothing readable}, not $WANT, 30 seconds after the deploy gave up"
          if [ "$EVENT" = push ]; then
            gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" \
              && echo "::error::dispatched a fresh deploy of $BRANCH's head; this run stays red so the lost deploy is seen"
          else
            echo "::error::this run was itself a dispatched deploy: not dispatching again; the next push deploys"
          fi
          exit 1
