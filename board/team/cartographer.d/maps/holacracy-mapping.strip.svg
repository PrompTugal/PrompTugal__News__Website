<text x="30" y="62" font-size="14" fill="#444">strip, draft, made 2026-11-22T22:54Z by cartographer.d@AgentiCCells.dinis; the match is holacracy.d's and maestro.d's own judgement (Holacracy constitution v5.0)</text>
<text x="30" y="90" font-size="15" fill="#111">Strong: 10   Partial: 4   Missing: 2   (green, amber, red)</text>
