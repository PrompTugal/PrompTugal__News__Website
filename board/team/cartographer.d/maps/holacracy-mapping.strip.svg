<text x="384" y="233" font-size="12" fill="#222">(accountabilities); "never" lines (limits)</text>
<text x="384" y="262" font-size="12" font-weight="600" fill="#333">Strong</text>
<rect x="718" y="120" width="330" height="150" rx="6" fill="#cfe9d6" stroke="#666"><title>One person fills many roles: One session runs several roles as sub-agents (Strong)</title></rect>
