<text x="40" y="262" font-size="12" font-weight="600" fill="#333">Strong</text>
<rect x="374" y="120" width="330" height="150" rx="6" fill="#cfe9d6" stroke="#666"><title>Role: purpose, domains, accountabilities: A role file or brief (purpose); the policy grant of paths an agent may write (domains, almost literally); the "owns" lines (accountabilities); "never" lines (limits) (Strong)</title></rect>
<text x="384" y="142" font-size="15" font-weight="600" fill="#111">Role: purpose, domains,</text>
<text x="384" y="160" font-size="15" font-weight="600" fill="#111">accountabilities</text>
<text x="384" y="188" font-size="12" fill="#222">A role file or brief (purpose); the policy</text>
