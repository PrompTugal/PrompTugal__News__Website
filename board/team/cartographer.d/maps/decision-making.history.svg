<text x="70" y="630" font-size="19" fill="#111" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1394;0.1515;1.0000" dur="33s" repeatCount="indefinite"/>6 November: decisions become pages, with every option shown. The first form of the idea.</text>
<text x="70" y="654" font-size="14" fill="#666" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1394;0.1515;1.0000" dur="33s" repeatCount="indefinite"/>2026-11-06; source: claude (see sources_read in the JSON)</text>
<text x="70" y="630" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1515;0.1636;0.2909;0.3030;1.0000" dur="33s" repeatCount="indefinite"/>Still 6 November: the owner's recommendation is the default; push it and try it live.</text>
<text x="70" y="654" font-size="14" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1515;0.1636;0.2909;0.3030;1.0000" dur="33s" repeatCount="indefinite"/>2026-11-06T13:20Z; source: claude (see sources_read in the JSON)</text>
<text x="70" y="630" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3030;0.3152;0.4424;0.4545;1.0000" dur="33s" repeatCount="indefinite"/>19 November: signed commits for every agent. Identity becomes a working product.</text>
<text x="70" y="654" font-size="14" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3030;0.3152;0.4424;0.4545;1.0000" dur="33s" repeatCount="indefinite"/>2026-11-19T01:05Z; source: guidance (see sources_read in the JSON)</text>
<text x="70" y="630" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4545;0.4667;0.5939;0.6061;1.0000" dur="33s" repeatCount="indefinite"/>22 November, early: the first org chart, the record of who holds what, is drawn by an agent.</text>
<text x="70" y="654" font-size="14" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4545;0.4667;0.5939;0.6061;1.0000" dur="33s" repeatCount="indefinite"/>2026-11-22T03:58Z; source: holacracy (see sources_read in the JSON)</text>
<text x="70" y="630" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6061;0.6182;0.7455;0.7576;1.0000" dur="33s" repeatCount="indefinite"/>22 November, morning: Dinis asks for decisions to be playable and answerable from one place. A prototype is asked for.</text>
<text x="70" y="654" font-size="14" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6061;0.6182;0.7455;0.7576;1.0000" dur="33s" repeatCount="indefinite"/>2026-11-22T09:05Z; source: strategy (see sources_read in the JSON)</text>
<text x="70" y="630" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7576;0.7697;1.0000" dur="33s" repeatCount="indefinite"/>22 November, afternoon: strategy draws the first map. The page and the keys are placed; the record starts to take shape; the context brief begins.</text>
<text x="70" y="654" font-size="14" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7576;0.7697;1.0000" dur="33s" repeatCount="indefinite"/>2026-11-22T13:30Z; source: strategy (see sources_read in the JSON)</text>
