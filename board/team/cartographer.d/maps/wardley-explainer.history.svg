<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-label="What a Wardley map is, in five steps (an invented teaching example)" font-family="system-ui, sans-serif">
<rect width="1100" height="760" fill="#fff"/>
<text x="70" y="32" font-size="20" font-weight="600" fill="#111">What a Wardley map is, in five steps (an invented teaching example)</text>
<text x="70" y="54" font-size="12" fill="#444">history map, draft, made 2026-11-22T23:20Z by cartographer.d@AgentiCCells.dinis; plays in a loop of 43 seconds; positions are a reading of the sources</text>
<rect x="70" y="80" width="990" height="490" fill="none" stroke="#999"/>
<text x="76" y="588" font-size="12" fill="#555">Genesis</text>
<line x1="317.5" y1="80" x2="317.5" y2="570" stroke="#ccc" stroke-dasharray="4 4"/>
<text x="323.5" y="588" font-size="12" fill="#555">Custom-built</text>
<line x1="565" y1="80" x2="565" y2="570" stroke="#ccc" stroke-dasharray="4 4"/>
<text x="571" y="588" font-size="12" fill="#555">Product (+ rental)</text>
<line x1="812.5" y1="80" x2="812.5" y2="570" stroke="#ccc" stroke-dasharray="4 4"/>
<text x="818.5" y="588" font-size="12" fill="#555">Commodity (+ utility)</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.0002;0.0186;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="565 94.7;565 94.7;565 94.7;565 94.7" keyTimes="0.0000;0.0002;0.0186;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="7" fill="#1f3a5f"/><text x="12" y="5" font-size="16" fill="#111">Ana wants fresh bread at her door</text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.1163;0.1349;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="565 168.2;565 168.2;565 168.2;565 168.2;367 168.2;367 168.2" keyTimes="0.0000;0.1163;0.1349;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="7" fill="#1f3a5f"/><text x="12" y="5" font-size="16" fill="#111">An order page she can use</text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1;1;1" keyTimes="0.0000;0.2326;0.2512;0.4837;0.5395;0.6000;0.6558;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="565 266.2;565 266.2;565 266.2;565 266.2;614.5 266.2;614.5 266.2;842.2 266.2;842.2 266.2" keyTimes="0.0000;0.2326;0.2512;0.4837;0.5395;0.6000;0.6558;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="7" fill="#1f3a5f"/><text x="12" y="5" font-size="16" fill="#111">Delivery</text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.2326;0.2512;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="565 325;565 325;565 325;565 325;268 325;268 325" keyTimes="0.0000;0.2326;0.2512;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="7" fill="#1f3a5f"/><text x="12" y="5" font-size="16" fill="#111">Baking the bread</text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.3488;0.3674;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="565 374;565 374;565 374;565 374;763 374;763 374" keyTimes="0.0000;0.3488;0.3674;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="7" fill="#1f3a5f"/><text x="12" y="5" font-size="16" fill="#111">The oven</text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.3488;0.3674;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="565 452.4;565 452.4;565 452.4;565 452.4;881.8 452.4;881.8 452.4" keyTimes="0.0000;0.3488;0.3674;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="7" fill="#1f3a5f"/><text x="12" y="5" font-size="16" fill="#111">Flour</text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.3488;0.3674;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="565 530.8;565 530.8;565 530.8;565 530.8;1010.5 530.8;1010.5 530.8" keyTimes="0.0000;0.3488;0.3674;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="7" fill="#1f3a5f"/><text x="12" y="5" font-size="16" fill="#111">Electricity</text></g></g>
<text x="70" y="664" font-size="19" fill="#111" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1070;0.1163;1.0000" dur="43s" repeatCount="indefinite"/>Start with a person and what they need. Ana wants fresh bread at her door. Everything on</text>
<text x="70" y="687" font-size="19" fill="#111" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1070;0.1163;1.0000" dur="43s" repeatCount="indefinite"/>the map exists to meet that one need, so it goes at the top.</text>
<text x="70" y="734" font-size="14" fill="#666" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1070;0.1163;1.0000" dur="43s" repeatCount="indefinite"/>step 1; source: sherpa (see sources_read in the JSON)</text>
<text x="70" y="664" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1163;0.1256;0.2233;0.2326;1.0000" dur="43s" repeatCount="indefinite"/>What does her need depend on? First, something she can see and use: an order page. The</text>
<text x="70" y="687" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1163;0.1256;0.2233;0.2326;1.0000" dur="43s" repeatCount="indefinite"/>higher a part sits, the more visible it is to the person it serves.</text>
<text x="70" y="734" font-size="14" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1163;0.1256;0.2233;0.2326;1.0000" dur="43s" repeatCount="indefinite"/>step 2; source: sherpa (see sources_read in the JSON)</text>
<text x="70" y="664" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2326;0.2419;0.3395;0.3488;1.0000" dur="43s" repeatCount="indefinite"/>The order page depends on delivery, and on bread that is actually baked. Each part</text>
<text x="70" y="687" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2326;0.2419;0.3395;0.3488;1.0000" dur="43s" repeatCount="indefinite"/>depends on the ones below it, and Ana never sees them.</text>
<text x="70" y="734" font-size="14" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2326;0.2419;0.3395;0.3488;1.0000" dur="43s" repeatCount="indefinite"/>step 3; source: sherpa (see sources_read in the JSON)</text>
<text x="70" y="664" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3488;0.3581;0.4558;0.4651;1.0000" dur="43s" repeatCount="indefinite"/>Baking needs an oven and flour, and the oven needs electricity. Now we have a chain,</text>
<text x="70" y="687" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3488;0.3581;0.4558;0.4651;1.0000" dur="43s" repeatCount="indefinite"/>from what Ana sees at the top to what is hidden at the bottom.</text>
<text x="70" y="734" font-size="14" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3488;0.3581;0.4558;0.4651;1.0000" dur="43s" repeatCount="indefinite"/>step 4; source: sherpa (see sources_read in the JSON)</text>
<text x="70" y="664" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4651;0.4744;0.5721;0.5814;1.0000" dur="43s" repeatCount="indefinite"/>Now the second idea, left to right. Parts mature. On the left, new and one of a kind,</text>
<text x="70" y="687" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4651;0.4744;0.5721;0.5814;1.0000" dur="43s" repeatCount="indefinite"/>like this bakery's recipe. On the right, everyday and cheap, like electricity. The map</text>
<text x="70" y="710" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4651;0.4744;0.5721;0.5814;1.0000" dur="43s" repeatCount="indefinite"/>spreads out.</text>
<text x="70" y="734" font-size="14" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4651;0.4744;0.5721;0.5814;1.0000" dur="43s" repeatCount="indefinite"/>step 5; source: invented (see sources_read in the JSON)</text>
<text x="70" y="664" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5814;0.5907;0.6884;0.6977;1.0000" dur="43s" repeatCount="indefinite"/>Parts do not stay still. Delivery services become everyday, and delivery drifts to the</text>
<text x="70" y="687" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5814;0.5907;0.6884;0.6977;1.0000" dur="43s" repeatCount="indefinite"/>right. Whatever is already everyday is rarely worth building for yourself.</text>
<text x="70" y="734" font-size="14" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5814;0.5907;0.6884;0.6977;1.0000" dur="43s" repeatCount="indefinite"/>step 6; source: invented (see sources_read in the JSON)</text>
<text x="70" y="664" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6977;0.7070;0.8047;0.8140;1.0000" dur="43s" repeatCount="indefinite"/>Here is the decision the map changes. Do not build your own delivery. Use an everyday</text>
<text x="70" y="687" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6977;0.7070;0.8047;0.8140;1.0000" dur="43s" repeatCount="indefinite"/>one, and spend your effort on the recipe, the part on the left that only you can do.</text>
<text x="70" y="734" font-size="14" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6977;0.7070;0.8047;0.8140;1.0000" dur="43s" repeatCount="indefinite"/>step 7; source: invented (see sources_read in the JSON)</text>
<text x="70" y="664" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8140;0.8233;1.0000" dur="43s" repeatCount="indefinite"/>That is a Wardley map. Two ways in from here: edit this map and make it your own, or</text>
<text x="70" y="687" font-size="19" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8140;0.8233;1.0000" dur="43s" repeatCount="indefinite"/>watch how a map changes over time, one dated move at a time.</text>
<text x="70" y="734" font-size="14" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8140;0.8233;1.0000" dur="43s" repeatCount="indefinite"/>step 8; source: cartographer (see sources_read in the JSON)</text>
<text x="70" y="754" font-size="11" fill="#555">Evolution, left to right. Visible to the user, bottom to top. A circle appears when the sources first record the component and slides as it matures.</text>
</svg>
