<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 700" role="img" aria-label="What a Wardley map is, in five steps (an invented teaching example)" font-family="system-ui, sans-serif">
<rect width="420" height="700" fill="#fff"/>
<text x="14" y="22" font-size="18" font-weight="600" fill="#111">What a Wardley map is, in five</text>
<text x="14" y="42" font-size="18" font-weight="600" fill="#111">steps (an invented teaching</text>
<text x="14" y="62" font-size="18" font-weight="600" fill="#111">example)</text>
<rect x="14" y="86" width="392" height="364" fill="none" stroke="#999"/>
<text x="20" y="468" font-size="10" fill="#555">Genesis</text>
<line x1="112" y1="86" x2="112" y2="450" stroke="#ccc" stroke-dasharray="4 4"/>
<text x="118" y="468" font-size="10" fill="#555">Custom-built</text>
<line x1="210" y1="86" x2="210" y2="450" stroke="#ccc" stroke-dasharray="4 4"/>
<text x="216" y="468" font-size="10" fill="#555">Product</text>
<line x1="308" y1="86" x2="308" y2="450" stroke="#ccc" stroke-dasharray="4 4"/>
<text x="314" y="468" font-size="10" fill="#555">Commodity</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.0002;0.0186;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 96.9;210 96.9;210 96.9;210 96.9" keyTimes="0.0000;0.0002;0.0186;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="end" font-size="20" fill="#111"><tspan x="-13" y="-3">Ana wants fresh</tspan><tspan x="-13" y="18">bread at her door</tspan></text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.1163;0.1349;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 151.5;210 151.5;210 151.5;210 151.5;131.6 151.5;131.6 151.5" keyTimes="0.0000;0.1163;0.1349;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="start" font-size="20" fill="#111"><tspan x="13" y="-3">An order page she</tspan><tspan x="13" y="18">can use</tspan></text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1;1;1" keyTimes="0.0000;0.2326;0.2512;0.4837;0.5395;0.6000;0.6558;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 224.3;210 224.3;210 224.3;210 224.3;229.6 224.3;229.6 224.3;319.8 224.3;319.8 224.3" keyTimes="0.0000;0.2326;0.2512;0.4837;0.5395;0.6000;0.6558;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="end" font-size="20" fill="#111"><tspan x="-13" y="7">Delivery</tspan></text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.2326;0.2512;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 268;210 268;210 268;210 268;92.4 268;92.4 268" keyTimes="0.0000;0.2326;0.2512;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="start" font-size="20" fill="#111"><tspan x="13" y="7">Baking the bread</tspan></text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.3488;0.3674;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 304.4;210 304.4;210 304.4;210 304.4;288.4 304.4;288.4 304.4" keyTimes="0.0000;0.3488;0.3674;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="end" font-size="20" fill="#111"><tspan x="-13" y="7">The oven</tspan></text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.3488;0.3674;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 362.6;210 362.6;210 362.6;210 362.6;335.4 362.6;335.4 362.6" keyTimes="0.0000;0.3488;0.3674;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="end" font-size="20" fill="#111"><tspan x="-13" y="7">Flour</tspan></text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.3488;0.3674;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 420.9;210 420.9;210 420.9;210 420.9;386.4 420.9;386.4 420.9" keyTimes="0.0000;0.3488;0.3674;0.4837;0.5395;1.0000" dur="43s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="end" font-size="20" fill="#111"><tspan x="-13" y="7">Electricity</tspan></text></g></g>
<text x="14" y="504" font-size="18" fill="#111" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1070;0.1163;1.0000" dur="43s" repeatCount="indefinite"/>Start with a person and what they need.</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1070;0.1163;1.0000" dur="43s" repeatCount="indefinite"/>Ana wants fresh bread at her door.</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1070;0.1163;1.0000" dur="43s" repeatCount="indefinite"/>Everything on the map exists to meet</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1070;0.1163;1.0000" dur="43s" repeatCount="indefinite"/>that one need, so it goes at the top.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1070;0.1163;1.0000" dur="43s" repeatCount="indefinite"/>step 1; source: sherpa</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1163;0.1256;0.2233;0.2326;1.0000" dur="43s" repeatCount="indefinite"/>What does her need depend on? First,</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1163;0.1256;0.2233;0.2326;1.0000" dur="43s" repeatCount="indefinite"/>something she can see and use: an order</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1163;0.1256;0.2233;0.2326;1.0000" dur="43s" repeatCount="indefinite"/>page. The higher a part sits, the more</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1163;0.1256;0.2233;0.2326;1.0000" dur="43s" repeatCount="indefinite"/>visible it is to the person it serves.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1163;0.1256;0.2233;0.2326;1.0000" dur="43s" repeatCount="indefinite"/>step 2; source: sherpa</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2326;0.2419;0.3395;0.3488;1.0000" dur="43s" repeatCount="indefinite"/>The order page depends on delivery, and</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2326;0.2419;0.3395;0.3488;1.0000" dur="43s" repeatCount="indefinite"/>on bread that is actually baked. Each</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2326;0.2419;0.3395;0.3488;1.0000" dur="43s" repeatCount="indefinite"/>part depends on the ones below it, and</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2326;0.2419;0.3395;0.3488;1.0000" dur="43s" repeatCount="indefinite"/>Ana never sees them.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2326;0.2419;0.3395;0.3488;1.0000" dur="43s" repeatCount="indefinite"/>step 3; source: sherpa</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3488;0.3581;0.4558;0.4651;1.0000" dur="43s" repeatCount="indefinite"/>Baking needs an oven and flour, and the</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3488;0.3581;0.4558;0.4651;1.0000" dur="43s" repeatCount="indefinite"/>oven needs electricity. Now we have a</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3488;0.3581;0.4558;0.4651;1.0000" dur="43s" repeatCount="indefinite"/>chain, from what Ana sees at the top to</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3488;0.3581;0.4558;0.4651;1.0000" dur="43s" repeatCount="indefinite"/>what is hidden at the bottom.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3488;0.3581;0.4558;0.4651;1.0000" dur="43s" repeatCount="indefinite"/>step 4; source: sherpa</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4651;0.4744;0.5721;0.5814;1.0000" dur="43s" repeatCount="indefinite"/>Now the second idea, left to right.</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4651;0.4744;0.5721;0.5814;1.0000" dur="43s" repeatCount="indefinite"/>Parts mature. On the left, new and one</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4651;0.4744;0.5721;0.5814;1.0000" dur="43s" repeatCount="indefinite"/>of a kind, like this bakery's recipe. On</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4651;0.4744;0.5721;0.5814;1.0000" dur="43s" repeatCount="indefinite"/>the right, everyday and cheap, like</text>
<text x="14" y="600" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4651;0.4744;0.5721;0.5814;1.0000" dur="43s" repeatCount="indefinite"/>electricity. The map spreads out.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4651;0.4744;0.5721;0.5814;1.0000" dur="43s" repeatCount="indefinite"/>step 5; source: invented</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5814;0.5907;0.6884;0.6977;1.0000" dur="43s" repeatCount="indefinite"/>Parts do not stay still. Delivery</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5814;0.5907;0.6884;0.6977;1.0000" dur="43s" repeatCount="indefinite"/>services become everyday, and delivery</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5814;0.5907;0.6884;0.6977;1.0000" dur="43s" repeatCount="indefinite"/>drifts to the right. Whatever is already</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5814;0.5907;0.6884;0.6977;1.0000" dur="43s" repeatCount="indefinite"/>everyday is rarely worth building for</text>
<text x="14" y="600" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5814;0.5907;0.6884;0.6977;1.0000" dur="43s" repeatCount="indefinite"/>yourself.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5814;0.5907;0.6884;0.6977;1.0000" dur="43s" repeatCount="indefinite"/>step 6; source: invented</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6977;0.7070;0.8047;0.8140;1.0000" dur="43s" repeatCount="indefinite"/>Here is the decision the map changes. Do</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6977;0.7070;0.8047;0.8140;1.0000" dur="43s" repeatCount="indefinite"/>not build your own delivery. Use an</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6977;0.7070;0.8047;0.8140;1.0000" dur="43s" repeatCount="indefinite"/>everyday one, and spend your effort on</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6977;0.7070;0.8047;0.8140;1.0000" dur="43s" repeatCount="indefinite"/>the recipe, the part on the left that</text>
<text x="14" y="600" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6977;0.7070;0.8047;0.8140;1.0000" dur="43s" repeatCount="indefinite"/>only you can do.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6977;0.7070;0.8047;0.8140;1.0000" dur="43s" repeatCount="indefinite"/>step 7; source: invented</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8140;0.8233;1.0000" dur="43s" repeatCount="indefinite"/>That is a Wardley map. Two ways in from</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8140;0.8233;1.0000" dur="43s" repeatCount="indefinite"/>here: edit this map and make it your</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8140;0.8233;1.0000" dur="43s" repeatCount="indefinite"/>own, or watch how a map changes over</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8140;0.8233;1.0000" dur="43s" repeatCount="indefinite"/>time, one dated move at a time.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8140;0.8233;1.0000" dur="43s" repeatCount="indefinite"/>step 8; source: cartographer</text>
</svg>
