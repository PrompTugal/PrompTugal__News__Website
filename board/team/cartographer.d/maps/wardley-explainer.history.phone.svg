<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 700" role="img" aria-label="What a Wardley map is" font-family="system-ui, sans-serif">
<rect width="420" height="700" fill="#fff"/>
<text x="14" y="22" font-size="18" font-weight="600" fill="#111">What a Wardley map is</text>
<rect x="14" y="86" width="392" height="364" fill="none" stroke="#999"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4848;0.4929;1.0000" dur="99s" repeatCount="indefinite"/>
<text x="20" y="468" font-size="10" fill="#555">Genesis</text>
<line x1="112" y1="86" x2="112" y2="450" stroke="#ccc" stroke-dasharray="4 4"/>
<text x="118" y="468" font-size="10" fill="#555">Custom-built</text>
<line x1="210" y1="86" x2="210" y2="450" stroke="#ccc" stroke-dasharray="4 4"/>
<text x="216" y="468" font-size="10" fill="#555">Product</text>
<line x1="308" y1="86" x2="308" y2="450" stroke="#ccc" stroke-dasharray="4 4"/>
<text x="314" y="468" font-size="10" fill="#555">Commodity</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.0001;0.0081;1.0000" dur="99s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 123.4;210 123.4;210 123.4;210 123.4" keyTimes="0.0000;0.0001;0.0081;1.0000" dur="99s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="end" font-size="20" fill="#111"><tspan x="-13" y="-3">Ana wants fresh</tspan><tspan x="-13" y="18">bread at her door</tspan></text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.1212;0.1293;0.4929;0.5333;1.0000" dur="99s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 170.2;210 170.2;210 170.2;210 170.2;131.6 170.2;131.6 170.2" keyTimes="0.0000;0.1212;0.1293;0.4929;0.5333;1.0000" dur="99s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="start" font-size="20" fill="#111"><tspan x="13" y="-3">An order page she</tspan><tspan x="13" y="18">can use</tspan></text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1;1;1" keyTimes="0.0000;0.2424;0.2505;0.4929;0.5333;0.6141;0.6545;1.0000" dur="99s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 232.6;210 232.6;210 232.6;210 232.6;229.6 232.6;229.6 232.6;319.8 232.6;319.8 232.6" keyTimes="0.0000;0.2424;0.2505;0.4929;0.5333;0.6141;0.6545;1.0000" dur="99s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="end" font-size="20" fill="#111"><tspan x="-13" y="7">Delivery</tspan></text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.2424;0.2505;0.4929;0.5333;1.0000" dur="99s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 270;210 270;210 270;210 270;92.4 270;92.4 270" keyTimes="0.0000;0.2424;0.2505;0.4929;0.5333;1.0000" dur="99s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="start" font-size="20" fill="#111"><tspan x="13" y="-3">The recipe and</tspan><tspan x="13" y="18">the baking</tspan></text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.3636;0.3717;0.4929;0.5333;1.0000" dur="99s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 301.2;210 301.2;210 301.2;210 301.2;288.4 301.2;288.4 301.2" keyTimes="0.0000;0.3636;0.3717;0.4929;0.5333;1.0000" dur="99s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="end" font-size="20" fill="#111"><tspan x="-13" y="7">The oven</tspan></text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.3636;0.3717;0.4929;0.5333;1.0000" dur="99s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 351.1;210 351.1;210 351.1;210 351.1;335.4 351.1;335.4 351.1" keyTimes="0.0000;0.3636;0.3717;0.4929;0.5333;1.0000" dur="99s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="end" font-size="20" fill="#111"><tspan x="-13" y="7">Flour</tspan></text></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0.0000;0.3636;0.3717;0.4929;0.5333;1.0000" dur="99s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="210 401;210 401;210 401;210 401;386.4 401;386.4 401" keyTimes="0.0000;0.3636;0.3717;0.4929;0.5333;1.0000" dur="99s" repeatCount="indefinite"/>
<circle r="8" fill="#1f3a5f"/><text text-anchor="end" font-size="20" fill="#111"><tspan x="-13" y="7">Electricity</tspan></text></g></g>
<text x="14" y="504" font-size="18" fill="#111" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1172;0.1212;1.0000" dur="99s" repeatCount="indefinite"/>Start with a person and what they need.</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1172;0.1212;1.0000" dur="99s" repeatCount="indefinite"/>Ana wants fresh bread at her door.</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1172;0.1212;1.0000" dur="99s" repeatCount="indefinite"/>Everything on the map exists to meet</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1172;0.1212;1.0000" dur="99s" repeatCount="indefinite"/>that one need, so it goes at the top.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1172;0.1212;1.0000" dur="99s" repeatCount="indefinite"/>Step 1 of 8</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1212;0.1253;0.2384;0.2424;1.0000" dur="99s" repeatCount="indefinite"/>What does her need depend on? First,</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1212;0.1253;0.2384;0.2424;1.0000" dur="99s" repeatCount="indefinite"/>something she can see and use: an order</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1212;0.1253;0.2384;0.2424;1.0000" dur="99s" repeatCount="indefinite"/>page. The higher a part sits, the more</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1212;0.1253;0.2384;0.2424;1.0000" dur="99s" repeatCount="indefinite"/>visible it is to the person it serves.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1212;0.1253;0.2384;0.2424;1.0000" dur="99s" repeatCount="indefinite"/>Step 2 of 8</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2424;0.2465;0.3596;0.3636;1.0000" dur="99s" repeatCount="indefinite"/>The order page depends on delivery, and</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2424;0.2465;0.3596;0.3636;1.0000" dur="99s" repeatCount="indefinite"/>on bread that is actually baked. Each</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2424;0.2465;0.3596;0.3636;1.0000" dur="99s" repeatCount="indefinite"/>part depends on the ones below it, and</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2424;0.2465;0.3596;0.3636;1.0000" dur="99s" repeatCount="indefinite"/>Ana never sees them.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2424;0.2465;0.3596;0.3636;1.0000" dur="99s" repeatCount="indefinite"/>Step 3 of 8</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3636;0.3677;0.4808;0.4848;1.0000" dur="99s" repeatCount="indefinite"/>Baking needs an oven and flour, and the</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3636;0.3677;0.4808;0.4848;1.0000" dur="99s" repeatCount="indefinite"/>oven needs electricity. Now we have a</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3636;0.3677;0.4808;0.4848;1.0000" dur="99s" repeatCount="indefinite"/>chain, from what Ana sees at the top to</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3636;0.3677;0.4808;0.4848;1.0000" dur="99s" repeatCount="indefinite"/>what is hidden at the bottom.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3636;0.3677;0.4808;0.4848;1.0000" dur="99s" repeatCount="indefinite"/>Step 4 of 8</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4848;0.4889;0.6020;0.6061;1.0000" dur="99s" repeatCount="indefinite"/>Now the second idea, left to right.</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4848;0.4889;0.6020;0.6061;1.0000" dur="99s" repeatCount="indefinite"/>Parts mature. On the left, new and one</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4848;0.4889;0.6020;0.6061;1.0000" dur="99s" repeatCount="indefinite"/>of a kind, like this bakery's recipe. On</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4848;0.4889;0.6020;0.6061;1.0000" dur="99s" repeatCount="indefinite"/>the right, everyday and cheap, like</text>
<text x="14" y="600" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4848;0.4889;0.6020;0.6061;1.0000" dur="99s" repeatCount="indefinite"/>electricity. The map spreads out.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4848;0.4889;0.6020;0.6061;1.0000" dur="99s" repeatCount="indefinite"/>Step 5 of 8</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6061;0.6101;0.7232;0.7273;1.0000" dur="99s" repeatCount="indefinite"/>Parts do not stay still. Delivery</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6061;0.6101;0.7232;0.7273;1.0000" dur="99s" repeatCount="indefinite"/>services become everyday, and delivery</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6061;0.6101;0.7232;0.7273;1.0000" dur="99s" repeatCount="indefinite"/>drifts to the right. Whatever is already</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6061;0.6101;0.7232;0.7273;1.0000" dur="99s" repeatCount="indefinite"/>everyday is rarely worth building for</text>
<text x="14" y="600" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6061;0.6101;0.7232;0.7273;1.0000" dur="99s" repeatCount="indefinite"/>yourself.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6061;0.6101;0.7232;0.7273;1.0000" dur="99s" repeatCount="indefinite"/>Step 6 of 8</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7273;0.7313;0.8444;0.8485;1.0000" dur="99s" repeatCount="indefinite"/>Here is the decision the map changes. Do</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7273;0.7313;0.8444;0.8485;1.0000" dur="99s" repeatCount="indefinite"/>not build your own delivery. Use an</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7273;0.7313;0.8444;0.8485;1.0000" dur="99s" repeatCount="indefinite"/>everyday one, and spend your effort on</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7273;0.7313;0.8444;0.8485;1.0000" dur="99s" repeatCount="indefinite"/>the recipe, the part on the left that</text>
<text x="14" y="600" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7273;0.7313;0.8444;0.8485;1.0000" dur="99s" repeatCount="indefinite"/>only you can do.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7273;0.7313;0.8444;0.8485;1.0000" dur="99s" repeatCount="indefinite"/>Step 7 of 8</text>
<text x="14" y="504" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8485;0.8525;1.0000" dur="99s" repeatCount="indefinite"/>That is a Wardley map. Two ways in from</text>
<text x="14" y="528" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8485;0.8525;1.0000" dur="99s" repeatCount="indefinite"/>here: edit this map and make it your</text>
<text x="14" y="552" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8485;0.8525;1.0000" dur="99s" repeatCount="indefinite"/>own, or watch how a map changes over</text>
<text x="14" y="576" font-size="18" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8485;0.8525;1.0000" dur="99s" repeatCount="indefinite"/>time, one dated move at a time.</text>
<text x="14" y="692" font-size="13" fill="#666" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8485;0.8525;1.0000" dur="99s" repeatCount="indefinite"/>Step 8 of 8</text>
<text x="14" y="670" font-size="12" fill="#555">Invented example for teaching. Positions are a judgement.</text>
</svg>
