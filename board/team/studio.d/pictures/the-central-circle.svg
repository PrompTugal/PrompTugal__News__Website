</style><title id="t">Who sits where, account D</title><desc id="d">Dinis has three branches: maestro.d, the conductors and helm.d. helm.d holds the central circle of nine roles. sites.d, hub.d and newsroom.d sit under no conductor today, which is question 2.</desc><rect width="1020" height="550" fill="var(--bg)"/><text class="t" x="24" y="38">The central circle: who sits where</text><text class="s" x="24" y="60">Account D, 22 November 2026. Solid green: the helm. Dashed orange: not yet placed.</text><rect class="b" x="450" y="80" width="120" height="40" rx="9"/><text class="n" x="510.0" y="105.0" text-anchor="middle">Dinis</text><path class="l" d="M510 120 C510 147.5 200 147.5 200 175"/><path class="l" d="M510 120 C510 147.5 510 147.5 510 175"/><path class="l" d="M510 120 C510 147.5 820 147.5 820 175"/><rect class="b" x="110" y="175" width="180" height="62" rx="9"/><text class="n" x="200.0" y="197" text-anchor="middle">maestro.d</text><text class="d" x="200.0" y="215" text-anchor="middle">execution across accounts</text><text class="d" x="200.0" y="231" text-anchor="middle">started every session below</text><rect class="b" x="400" y="175" width="220" height="62" rx="9"/><text class="n" x="510.0" y="197" text-anchor="middle">conductors</text><text class="d" x="510.0" y="215" text-anchor="middle">conductor.d @PrompTugal,</text><text class="d" x="510.0" y="231" text-anchor="middle">@SovereignWebsite, @AgentiCCells</text><rect class="h" x="710" y="175" width="220" height="62" rx="9"/><text class="n" x="820.0" y="197" text-anchor="middle">helm.d</text><text class="d" x="820.0" y="215" text-anchor="middle">peer of the conductors;</text><text class="d" x="820.0" y="231" text-anchor="middle">every agent not under a conductor</text><path class="l" d="M820 237 C820 268.5 520 268.5 520 300"/><path class="l" d="M820 237 C820 268.5 860 268.5 860 300"/><rect x="40" y="300" width="560" height="190" rx="12" fill="none" stroke="var(--hi)" stroke-width="2"/><text class="n" x="60" y=