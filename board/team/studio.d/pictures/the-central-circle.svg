or="middle">hub.d</text><rect class="q" x="660" y="440" width="300" height="34" rx="9"/><text class="n" x="810.0" y="462.0" text-anchor="middle">newsroom.d</text><text class="d" x="40" y="512">sherpa.d and accountant.d are the account D twins of sherpa@ and accountant@.</text><text class="d" x="40" y="530">Source: holacracy.d org-chart.json; helm.d decision page. Drawn by studio.d, 22 Nov 2026.</text></svg>