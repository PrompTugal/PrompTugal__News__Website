</style><title id="t">Decided: the path of a memo</title><desc id="d">After Dinis answered: the audio is deleted once transcribed; only the transcript is kept.</desc><rect width="1000" height="470" fill="var(--bg)"/><text class="t" x="24" y="38">The path of a memo: decided</text><text class="s" x="24" y="60">Decided 22 November 2026, about 15:47 UTC.</text><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="var(--line)"/></marker></defs><rect class="b" x="40" y="100" width="200" height="64" rx="9"/><text class="n" x="140.0" y="122" text-anchor="middle">Dinis</text><text class="d" x="140.0" y="140" text-anchor="middle">voice or text,</text><text class="d" x="140.0" y="156" text-anchor="middle">on any site</text><rect class="b" x="330" y="100" width="240" height="64" rx="9"/><text class="n" x="450.0" y="122" text-anchor="middle">Site lead agent&#x27;s lane</text><text class="d" x="450.0" y="140" text-anchor="middle">first reader of that site&#x27;s memo</text><rect class="b" x="660" y="100" width="200" height="64" rx="9"/><text class="n" x="760.0" y="137.0" text-anchor="middle">The agent the memo is for</text><path class="l" marker-end="url(#a)" d="M240 132 L328 132"/><path class="l" marker-end="url(#a)" d="M570 132 L658 132"/><rect class="b" x="330" y="240" width="240" height="64" rx="9"/><text class="n" x="450.0" y="262" text-anchor="middle">Transcript</text><text class="d" x="450.0" y="280" text-anchor="middle">kept</text><path class="l" d="M450 164 C450 202.0 450 202.0 450 240"/><rect class="h" x="20" y="230" width="300" height="100" rx="9"/><text class="n" x="170.0" y="252" text-anchor="middle">Decided: delete audio at once</text><text class="d" x="170.0" y="270" text-anchor="middle">Option A: transcript only</text><text class="d" x="170.0" y="286" text-anchor="middle">No audio vault is needed</text><text class="d" x="170.0" y="302" text-anchor="middle">(the deletion is irreversible)</text><path class="l" d="M320 272 L330 272"/><rect class="b" x="640" y="230" width="340" height="100" rx="9"/><text class="n" x="810.0" y="252" text-anchor="middle">sherpa.d&#x27;s wake: settled earlier</text><text class="d" x="810.0" y="270" text-anchor="middle">twice a day (07:37, 12:37, 17:37, 22:37 Lisbon)</text><text class="d" x="810.0" y="286" text-anchor="middle">made by maestro.d at Dinis&#x27;s word</text><path class="l" marker-end="url(#a)" d="M640 272 L572 272" stroke-dasharray="5 4"/><rect x="24" y="350" width="972" height="66" rx="10" class="b"/><text class="n" x="40" y="372">Dinis, verbatim (answered 22 Nov 2026 about 15:47 UTC, in helm.d's session):</text><text class="d" x="40" y="394" style="font-size:13.5px">“You can delete my audio straight away. I don&#x27;t even need to keep the audio.”</text><text class="d" x="40" y="450">Frozen when decided. The earlier picture, sherpa-memo-flow.svg, shows the questions as asked. Drawn by studio.d.</text></svg>