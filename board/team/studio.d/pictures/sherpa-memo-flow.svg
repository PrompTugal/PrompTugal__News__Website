<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><style>
:root{--bg:#ffffff;--fg:#1c2733;--mut:#5b6b7a;--box:#eef3f8;--line:#7f93a6;--hi:#0b6e4f;--hib:#e3f4ec;--q:#9a4d00;--qb:#fff1e0}
@media (prefers-color-scheme:dark){:root{--bg:#10181f;--fg:#e8eef4;--mut:#9fb0bf;--box:#1b2833;--line:#6b8196;--hi:#5fd3a6;--hib:#12332a;--q:#ffb066;--qb:#3a2a14}}
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:var(--fg)}
.t{font-size:22px;font-weight:700}.s{font-size:13px;fill:var(--mut)}.n{font-size:15px;font-weight:600}.d{font-size:12.5px;fill:var(--mut)}
.b{fill:var(--box);stroke:var(--line);stroke-width:1.5}.h{fill:var(--hib);stroke:var(--hi);stroke-width:2}.q{fill:var(--qb);stroke:var(--q);stroke-width:2;stroke-dasharray:6 4}
.l{stroke:var(--line);stroke-width:1.8;fill:none}
</style><title id="t">The path of a voice or text memo</title><desc id="d">A memo goes from Dinis to the site lead agent&#x27;s lane, then to the agent it is for. The transcript is kept. Question 2 decides the audio, question 1 decides sherpa.d&#x27;s wake that reads across sites.</desc><rect width="1000" height="440" fill="var(--bg)"/><text class="t" x="24" y="38">The path of a memo</text><text class="s" x="24" y="60">From any site to the agent that can act. Two questions for Dinis.</text><rect class="b" x="40" y="100" width="200" height="64" rx="9"/><text class="n" x="140.0" y="122" text-anchor="middle">Dinis</text><text class="d" x="140.0" y="140" text-anchor="middle">voice or text,</text><text class="d" x="140.0" y="156" text-anchor="middle">on any site</text><rect class="h" x="330" y="100" width="240" height="64" rx="9"/><text class="n" x="450.0" y="122" text-anchor="middle">Site lead agent&#x27;s lane</text><text class="d" x="450.0" y="140" text-anchor="middle">first reader of that site&#x27;s memo</text><text class="d" x="450.0" y="156" text-anchor="middle">(until the map exists: site&#x27;s conductor)</text><rect class="b" x="660" y="100" width="200" height="64" rx="9"/><text class="n" x="760.0" y="137.0" text-anchor="middle">The agent the memo is for</text><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="var(--line)"/></marker></defs><path class="l" marker-end="url(#a)" d="M240 132 L328 132"/><path class="l" marker-end="url(#a)" d="M570 132 L658 132"/><rect class="b" x="330" y="260" width="240" height="64" rx="9"/><text class="n" x="450.0" y="282" text-anchor="middle">Transcript</text><text class="d" x="450.0" y="300" text-anchor="middle">kept</text><path class="l" d="M450 164 C450 212.0 450 212.0 450 260"/><rect class="q" x="20" y="260" width="300" height="86" rx="9"/><text class="n" x="170.0" y="282" text-anchor="middle">Q2: the audio?</text><text class="d" x="170.0" y="300" text-anchor="middle">A transcript only</text><text class="d" x="170.0" y="316" text-anchor="middle">B audio 7 days, then deleted (recommended)</text><text class="d" x="170.0" y="332" text-anchor="middle">C both kept for ever</text><path class="l" d="M310 303 L330 303" stroke-dasharray="5 4"/><rect class="q" x="640" y="260" width="340" height="100" rx="9"/><text class="n" x="810.0" y="282" text-anchor="middle">Q1: sherpa.d&#x27;s wake?</text><text class="d" x="810.0" y="300" text-anchor="middle">sherpa.d reads memos across all sites:</text><text class="d" x="810.0" y="316" text-anchor="middle">needs, patterns, gaps</text><text class="d" x="810.0" y="332" text-anchor="middle">A twice a day (recommended)</text><text class="d" x="810.0" y="348" text-anchor="middle">B no wake; only when talked to</text><path class="l" marker-end="url(#a)" d="M640 303 L572 303" stroke-dasharray="5 4"/><text class="d" x="40" y="400">Solid: the path of a memo. Dashed orange: the two questions for Dinis, each at the step it changes.</text><text class="d" x="40" y="418">Source: helm.d decision page and sherpa.d feedback-everywhere. Drawn by studio.d.</text></svg>