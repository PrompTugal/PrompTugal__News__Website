<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 416" role="img" aria-labelledby="t d"><style>
:root{--bg:#ffffff;--fg:#1c2733;--mut:#5b6b7a;--box:#eef3f8;--line:#7f93a6;--hi:#0b6e4f;--hib:#e3f4ec;--q:#9a4d00;--qb:#fff1e0}
@media (prefers-color-scheme:dark){:root{--bg:#10181f;--fg:#e8eef4;--mut:#9fb0bf;--box:#1b2833;--line:#6b8196;--hi:#5fd3a6;--hib:#12332a;--q:#ffb066;--qb:#3a2a14}}
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:var(--fg)}
.t{font-size:22px;font-weight:700}.s{font-size:13px;fill:var(--mut)}.n{font-size:15px;font-weight:600}.d{font-size:12.5px;fill:var(--mut)}
.b{fill:var(--box);stroke:var(--line);stroke-width:1.5}.h{fill:var(--hib);stroke:var(--hi);stroke-width:2}.q{fill:var(--qb);stroke:var(--q);stroke-width:2;stroke-dasharray:6 4}
.l{stroke:var(--line);stroke-width:1.8;fill:none}
</style><title id="t">Which key signs the delegation?</title><desc id="d">Three options for the key that signs the delegation to decisions.d; the recommendation is the pki.sgit.ai anchor key.</desc><rect width="1020" height="416" fill="var(--bg)"/><text class="t" x="24" y="38">Which key signs the delegation?</text><text class="s" x="24" y="60">Asked 22 November 2026. Reserved to Dinis: keys.</text><rect class="b" x="40" y="86" width="200" height="56" rx="9"/><text class="n" x="140.0" y="108" text-anchor="middle">Asked by decisions.d</text><text class="d" x="140.0" y="126" text-anchor="middle">reviewers: counsel.d, security@</text><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="var(--line)"/></marker></defs><path class="l" marker-end="url(#a)" d="M240 114 L318 114"/><rect class="b" x="320" y="86" width="300" height="56" rx="9"/><text class="n" x="470.0" y="108" text-anchor="middle">Question for Dinis (reserved: keys)</text><text class="d" x="470.0" y="126" text-anchor="middle">Is your pki.sgit.ai anchor key the signing key?</text><path class="l" marker-end="url(#a)" d="M620 114 L690 114"/><rect class="b" x="690" y="86" width="270" height="56" rx="9"/><text class="n" x="825.0" y="108" text-anchor="middle">Next steps</text><text class="d" x="825.0" y="126" text-anchor="middle">counsel.d drafts, security@ reviews (Mon)</text><rect class="h" x="40" y="190" width="290" height="170" rx="10"/><text class="n" x="52" y="212">Yes: the pki.sgit.ai anchor key</text><text class="n" x="52" y="229">(dinis.cruz, sha256:db7f79fdd87e030a)</text><text class="d" x="52" y="252" style="fill:var(--hi)">+ Only you hold it</text><text class="d" x="52" y="268" style="fill:var(--hi)">+ Delegation, expiry, withdrawal exist there</text><text class="d" x="52" y="284" style="fill:var(--q)">− Receivers must reach pki.sgit.ai</text><text class="d" x="52" y="300" style="fill:var(--q)">− Your device is the single point of trust</text><text class="n" x="318" y="352" text-anchor="end" style="fill:var(--hi)">recommended</text><rect class="b" x="350" y="190" width="290" height="170" rx="10"/><text class="n" x="362" y="212">A new key made on your device, for</text><text class="n" x="362" y="229">this only</text><text class="d" x="362" y="252" style="fill:var(--hi)">+ Separate from your identity key</text><text class="d" x="362" y="268" style="fill:var(--q)">− A new key to publish and verify</text><rect class="b" x="660" y="190" width="290" height="170" rx="10"/><text class="n" x="672" y="212">Not yet</text><text class="d" x="672" y="235" style="fill:var(--hi)">+ Nothing changes until reviewed</text><text class="d" x="672" y="251" style="fill:var(--q)">− Decisions keep waiting on your sessions</text><text class="d" x="24" y="392">Ask id decisions.d/2026-11-22/1, first seen 13:38 UTC. Source: decisions.d storyboard. Drawn by studio.d, as asked.</text></svg>