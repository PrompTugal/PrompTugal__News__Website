<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 408" role="img" aria-labelledby="t d"><style>
:root{--bg:#ffffff;--fg:#1c2733;--mut:#5b6b7a;--box:#eef3f8;--line:#7f93a6;--hi:#0b6e4f;--hib:#e3f4ec;--q:#9a4d00;--qb:#fff1e0}
@media (prefers-color-scheme:dark){:root{--bg:#10181f;--fg:#e8eef4;--mut:#9fb0bf;--box:#1b2833;--line:#6b8196;--hi:#5fd3a6;--hib:#12332a;--q:#ffb066;--qb:#3a2a14}}
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:var(--fg)}
.t{font-size:22px;font-weight:700}.s{font-size:13px;fill:var(--mut)}.n{font-size:15px;font-weight:600}.d{font-size:12.5px;fill:var(--mut)}
.b{fill:var(--box);stroke:var(--line);stroke-width:1.5}.h{fill:var(--hib);stroke:var(--hi);stroke-width:2}.q{fill:var(--qb);stroke:var(--q);stroke-width:2;stroke-dasharray:6 4}
.l{stroke:var(--line);stroke-width:1.8;fill:none}
</style><title id="t">What we call Wardley maps, Cynefin, Holacracy and the rest</title><desc id="d">The umbrella word question and the answer: framework, singular, one website per framework.</desc><rect width="1020" height="408" fill="var(--bg)"/><text class="t" x="24" y="38">The word for frameworks: decided</text><text class="s" x="24" y="60">Decided 22 November 2026, about 16:57 UTC.</text><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="var(--line)"/></marker></defs><rect class="h" x="380" y="80" width="260" height="50" rx="9"/><text class="n" x="510.0" y="102" text-anchor="middle">Framework (singular)</text><text class="d" x="510.0" y="120" text-anchor="middle">one word; each is a framework</text><text class="d" x="510" y="146" text-anchor="middle">No umbrella site: one website per framework, each run by a named agent</text><path class="l" d="M510 130 C510 160.0 114 160.0 114 190"/><rect class="h" x="24" y="190" width="184" height="62" rx="9"/><text class="n" x="116.0" y="212" text-anchor="middle">Wardley Maps</text><text class="d" x="116.0" y="230" text-anchor="middle">cartographer.d runs it</text><path class="l" d="M510 130 C510 160.0 310 160.0 310 190"/><rect class="h" x="220" y="190" width="184" height="62" rx="9"/><text class="n" x="312.0" y="212" text-anchor="middle">Holacracy</text><text class="d" x="312.0" y="230" text-anchor="middle">holacracy.d runs it</text><path class="l" d="M510 130 C510 160.0 506 160.0 506 190"/><rect class="q" x="416" y="190" width="184" height="62" rx="9"/><text class="n" x="508.0" y="212" text-anchor="middle">Cynefin</text><text class="d" x="508.0" y="230" text-anchor="middle">a plan; owner named at start</text><path class="l" d="M510 130 C510 160.0 702 160.0 702 190"/><rect class="q" x="612" y="190" width="184" height="62" rx="9"/><text class="n" x="704.0" y="212" text-anchor="middle">Scrum, Kanban</text><text class="d" x="704.0" y="230" text-anchor="middle">a plan; owner named at start</text><path class="l" d="M510 130 C510 160.0 898 160.0 898 190"/><rect class="q" x="808" y="190" width="184" height="62" rx="9"/><text class="n" x="900.0" y="212" text-anchor="middle">SWOT, RACI</text><text class="d" x="900.0" y="230" text-anchor="middle">a plan; owner named at start</text><text class="d" x="24" y="276">Solid green: a named agent runs it. Dashed orange: a plan, licence first. What is left is each site's name and address: Dinis's.</text><rect x="24" y="298" width="972" height="66" rx="10" class="b"/><text class="n" x="40" y="320">Dinis, verbatim (answered 22 Nov 2026 about 16:57 UTC, in cartographer.d's session):</text><text class="d" x="40" y="340" style="font-size:13.5px">“They use framework, singular ... because each one is a framework, so each one has a unique website ... that we manage.”</text><text class="d" x="40" y="356" style="font-size:11.5px">Speech to text. Read by helm.d as close to option A, with one site per framework and no umbrella site.</text><text class="d" x="24" y="386">Ask id framework-word, reserved: yes (the brand). Frozen when decided. Drawn by studio.d.</text></svg>