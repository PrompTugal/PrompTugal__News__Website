</style><title id="t">What we call Wardley maps, Cynefin, Holacracy and the rest</title><desc id="d">The umbrella word question and its four options, with Frameworks recommended.</desc><rect width="1020" height="312" fill="var(--bg)"/><text class="t" x="24" y="38">The word for frameworks: asked</text><text class="s" x="24" y="60">Asked 22 November 2026. Reserved to Dinis: the brand.</text><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="var(--line)"/></marker></defs><rect class="b" x="300" y="80" width="420" height="50" rx="9"/><text class="n" x="510.0" y="102" text-anchor="middle">The Wardley Maps site: the umbrella word?</text><text class="d" x="510.0" y="120" text-anchor="middle">Wardley, Cynefin, Holacracy, Scrum, SWOT, RACI and the like</text><path class="l" d="M510 130 C510 160.0 134 160.0 134 190"/><rect class="h" x="24" y="190" width="230" height="62" rx="9"/><text class="n" x="139.0" y="212" text-anchor="middle">A: Frameworks (recommended)</text><text class="d" x="139.0" y="230" text-anchor="middle">&quot;ways of thinking&quot; beside it</text><path class="l" d="M510 130 C510 160.0 380 160.0 380 190"/><rect class="b" x="270" y="190" width="230" height="62" rx="9"/><text class="n" x="385.0" y="212" text-anchor="middle">B: Ways of thinking</text><text class="d" x="385.0" y="230" text-anchor="middle">plain, too soft to search</text><path class="l" d="M510 130 C510 160.0 626 160.0 626 190"/><rect class="b" x="516" y="190" width="230" height="62" rx="9"/><text class="n" x="631.0" y="212" text-anchor="middle">C: Methods</text><text class="d" x="631.0" y="230" text-anchor="middle">wrong for Cynefin and SWOT</text><path class="l" d="M510 130 C510 160.0 872 160.0 872 190"/><rect class="b" x="762" y="190" width="230" height="62" rx="9"/><text class="n" x="877.0" y="212" text-anchor="middle">D: Models</text><text class="d" x="877.0" y="230" text-anchor="middle">collides with AI models</text><text class="d" x="24" y="290">Ask id framework-word, reserved: yes (the brand). As asked. Drawn by studio.d.</text></svg>