</style><title id="t">Decided: who sits where, account D</title><desc id="d">After Dinis answered: sites.d, streaming.d and hub.d sit under the SovereignWebsite conductor; newsroom.d under sgit.ai; helm.d keeps the central circle of nine roles.</desc><rect width="1020" height="600" fill="var(--bg)"/><text class="t" x="24" y="38">The central circle: decided</text><text class="s" x="24" y="60">Decided 22 November 2026, about 15:47 UTC. Solid green: where each now sits.</text><rect class="b" x="450" y="80" width="120" height="40" rx="9"/><text class="n" x="510.0" y="105.0" text-anchor="middle">Dinis</text><path class="l" d="M510 120 C510 147.5 130 147.5 130 175"/><path class="l" d="M510 120 C510 147.5 330 147.5 330 175"/><path class="l" d="M510 120 C510 147.5 640 147.5 640 175"/><path class="l" d="M510 120 C510 147.5 880 147.5 880 175"/><rect class="b" x="40" y="175" width="180" height="62" rx="9"/><text class="n" x="130.0" y="197" text-anchor="middle">maestro.d</text><text class="d" x="130.0" y="215" text-anchor="middle">execution across accounts</text><rect class="b" x="250" y="175" width="160" height="62" rx="9"/><text class="n" x="330.0" y="197" text-anchor="middle">conductor.d</text><text class="d" x="330.0" y="215" text-anchor="middle">@PrompTugal</text><rect class="h" x="430" y="175" width="220" height="62" rx="9"/><text class="n" x="540.0" y="197" text-anchor="middle">conductor.d</text><text class="d" x="540.0" y="215" text-anchor="middle">@SovereignWebsite</text><rect class="h" x="780" y="175" width="200" height="62" rx="9"/><text class="n" x="880.0" y="197" text-anchor="middle">helm.d</text><text class="d" x="880.0" y="215" text-anchor="middle">peer of the conductors</text><path class="l" d="M540 237 C540 268.5 500 268.5 500 300"/><rect class="h" x="380" y="300" width="240" height="34" rx="9"/><text class="n" x="500.0" y="322.0" text-anchor="middle">sites.d (with streaming.d)</text><rect class="h" x="380" y="342" width="240" height="34" rx="9"/><text class="n" x="500.0" y="364.0" text-anchor="middle">hub.d</text><rect x="660" y="290" width="150" height="92" rx="10" fill="none" stroke="var(--hi)" stroke-width="2"/><text class="n" x="735" y="314" text-anchor="middle" style="fill:var(--hi)">sgit.ai</text><rect class="h" x="672" y="326" width="126" height="34" rx="9"/><text class="n" x="735.0" y="348.0" text-anchor="middle">newsroom.d</text><path class="l" d="M880 237 C880 268.5 880 268.5 880 300"/><rect x="830" y="290" width="160" height="150" rx="10" fill="none" stroke="var(--hi)" stroke-width="2"/><text class="n" x="910" y="312" text-anchor="middle" style="fill:var(--hi)">Central circle (9)</text><text class="d" x="910" y="334" text-anchor="middle">strategy, cartographer,</text><text class="d" x="910" y="350" text-anchor="middle">sherpa, accountant,</text><text class="d" x="910" y="366" text-anchor="middle">decisions, counsel,</text><text class="d" x="910" y="382" text-anchor="middle">studio, landscape,</text><text class="d" x="910" y="398" text-anchor="middle">holacracy</text><text class="d" x="40" y="300">Connections</text><text class="d" x="40" y="320">Asked by: helm.d</text><text class="d" x="40" y="338">Reviewed by: holacracy.d</text><text class="d" x="40" y="356">Acts: helm.d, conductor.d</text><text class="d" x="40" y="374">@SovereignWebsite, the sgit.ai side</text><rect x="24" y="460" width="972" height="66" rx="10" class="b"/><text class="n" x="40" y="482">Dinis, verbatim (answered 22 Nov 2026 about 15:47 UTC, in helm.d's session):</text><text class="d" x="40" y="504" style="font-size:13.5px">“So hub and sites are under the server and websites world, and the newsroom is under sgit.ai, so they should be there.”</text><text class="d" x="40" y="580">Frozen when decided. The earlier picture, the-central-circle.svg, shows the question as asked. Drawn by studio.d.</text></svg>