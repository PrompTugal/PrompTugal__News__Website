<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t"><title id="t">Konecta in Lisbon: about 1,300 staff now, about 2,000 by the end of 2027; about 700 new jobs; a new Global Delivery Center opening in Q1 2027; 680 workstations over 4,900 square metres</title><style>
.bg{fill:#f6f3ec}.ink{fill:#121317}.ink3{fill:#595c64}.grn{fill:#006600}.box{fill:#ece7db;stroke:#9d9580}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#111214}.ink{fill:#eceae4}.ink3{fill:#a6a39a}.grn{fill:#6dbb7e}.box{fill:#1a1b1e;stroke:#5f5b51}}
</style><rect class="bg" width="1200" height="630"/>
<text class="ink" x="50" y="80" font-size="60" font-weight="800">Konecta grows in Lisbon</text>
<text class="ink3" x="50" y="140" font-size="40">A new Global Delivery Center, opening Q1 2027</text>
<rect class="box" x="50" y="175" width="530" height="200" rx="12" stroke-width="2"/>
<text class="ink3" x="80" y="230" font-size="40">Staff in Lisbon now</text>
<text class="ink" x="80" y="330" font-size="96" font-weight="800">1,300</text>
<rect class="box" x="620" y="175" width="530" height="200" rx="12" stroke-width="2"/>
<text class="ink3" x="650" y="230" font-size="40">Target, end of 2027</text>
<text class="grn" x="650" y="330" font-size="96" font-weight="800">2,000</text>
<rect class="box" x="50" y="400" width="1100" height="110" rx="12" stroke-width="2"/>
<text class="grn" x="80" y="472" font-size="52" font-weight="800">+700 jobs</text>
<text class="ink" x="420" y="472" font-size="40">680 workstations, 4,900 m²</text>
<text class="ink3" x="50" y="582" font-size="38">Source: Konecta, 10 Nov 2026. Konecta's targets</text>
</svg>
