<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 442" width="420" height="442" role="img" aria-label="Five problems PagerDuty names in running AI agents in production, and what it did about each"><style>
.bg{fill:#f6f3ec}.ink{fill:#121317}.ink2{fill:#3f424a}.ink3{fill:#595c64}.rule{stroke:#9d9580}.bar{fill:#006600}.off{fill:#9d9580}.red{fill:#c52830}.grid{stroke:#d8d2c3}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#111214}.ink{fill:#eceae4}.ink2{fill:#c3c0b7}.ink3{fill:#a6a39a}.rule{stroke:#5f5b51}.bar{fill:#6dbb7e}.off{fill:#5f5b51}.red{fill:#f07278}.grid{stroke:#2e2f34}}
.box{fill:#ece7db;stroke:#9d9580}.top{fill:#e2eedf;stroke:#006600}@media (prefers-color-scheme:dark){.box{fill:#1a1b1e;stroke:#5f5b51}.top{fill:#16281c;stroke:#6dbb7e}}</style><rect class="bg" width="420" height="442"/><text class="ink" x="14" y="30" font-size="19" font-weight="700">AI agents in production</text><text class="ink3" x="14" y="50" font-size="13">PagerDuty, in its own account</text><text class="red" x="28" y="74" font-size="13" font-weight="700">What went wrong</text><text class="bar" x="226" y="74" font-size="13" font-weight="700">What PagerDuty did</text><rect class="box" x="14" y="86" width="196" height="56" rx="6" stroke-width="1"/><text class="ink" x="26" y="119" font-size="14" font-weight="700">Non-deterministic answers</text><rect class="top" x="218" y="86" width="188" height="56" rx="6" stroke-width="1.2"/><text class="ink" x="228" y="111" font-size="13">A checking agent;</text><text class="ink" x="228" y="129" font-size="13">permissions</text><rect class="box" x="14" y="150" width="196" height="56" rx="6" stroke-width="1"/><text class="ink" x="26" y="183" font-size="14" font-weight="700">Context fatigue</text><rect class="top" x="218" y="150" width="188" height="56" rx="6" stroke-width="1.2"/><text class="ink" x="228" y="175" font-size="13">Smaller agents, grouped</text><text class="ink" x="228" y="193" font-size="13">by domain</text><rect class="box" x="14" y="214" width="196" height="56" rx="6" stroke-width="1"/><text class="ink" x="26" y="247" font-size="14" font-weight="700">Errors that compound</text><rect class="top" x="218" y="214" width="188" height="56" rx="6" stroke-width="1.2"/><text class="ink" x="228" y="239" font-size="13">Traces, evals and CI</text><text class="ink" x="228" y="257" font-size="13">gates</text><rect class="box" x="14" y="278" width="196" height="56" rx="6" stroke-width="1"/><text class="ink" x="26" y="311" font-size="14" font-weight="700">Prompt injection</text><rect class="top" x="218" y="278" width="188" height="56" rx="6" stroke-width="1.2"/><text class="ink" x="228" y="311" font-size="13">Guardrails at two layers</text><rect class="box" x="14" y="342" width="196" height="56" rx="6" stroke-width="1"/><text class="ink" x="26" y="375" font-size="14" font-weight="700">Poor data, stale "facts"</text><rect class="top" x="218" y="342" width="188" height="56" rx="6" stroke-width="1.2"/><text class="ink" x="228" y="375" font-size="13">Memory that tracks time</text><text class="ink3" x="14" y="428" font-size="12.5">From PagerDuty's engineering blog, 11 June 2026.</text></svg>