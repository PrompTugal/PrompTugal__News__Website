<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t"><title id="t">Discord's first engineering hub outside San Francisco is in Lisbon, with about 30 engineers planned by the end of 2027</title><style>
