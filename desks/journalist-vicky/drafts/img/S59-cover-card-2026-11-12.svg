<text class="ink" x="60" y="100" font-size="64" font-weight="800">Discord opens in Lisbon</text>
<text class="ink3" x="60" y="160" font-size="42">Its first engineering hub outside San Francisco</text>
<rect class="box" x="60" y="200" width="1080" height="250" rx="16" stroke-width="2"/>
