.box{fill:#ece7db;stroke:#9d9580}@media (prefers-color-scheme:dark){.box{fill:#1a1b1e;stroke:#5f5b51}}</style><rect class="bg" width="420" height="388"/><text class="ink" x="14" y="30" font-size="20" font-weight="700">Two editions a day</text><text class="ink3" x="14" y="50" font-size="13">PrompTugal.news in summit week, from 7 November</text><rect class="box" x="14" y="70" width="392" height="104" rx="8" stroke-width="1"/><text class="bar" x="30" y="98" font-size="17" font-weight="700">Morning</text><text class="ink2" x="30" y="116" font-size="13">What is on today</text><circle class="bar" cx="36" cy="136" r="3.5"/><text class="ink" x="48" y="141" font-size="14">If you are there: five things to plan around</text><circle class="bar" cx="36" cy="160" r="3.5"/><text class="ink" x="48" y="165" font-size="14">If you are following from afar: the latest</text><rect class="box" x="14" y="190" width="392" height="128" rx="8" stroke-width="1"/><text class="bar" x="30" y="218" font-size="17" font-weight="700">Evening</text><text class="ink2" x="30" y="236" font-size="13">What happened, and what is next</text><circle class="bar" cx="36" cy="256" r="3.5"/><text class="ink" x="48" y="261" font-size="14">Published today</text><circle class="bar" cx="36" cy="280" r="3.5"/><text class="ink" x="48" y="285" font-size="14">The latest</text><circle class="bar" cx="36" cy="304" r="3.5"/><text class="ink" x="48" y="309" font-size="14">Tomorrow</text><text class="ink" x="14" y="350" font-size="14">Each edition: a public page, and a short</text><text class="ink" x="14" y="370" font-size="14">plain-text email with numbered links.</text></svg>