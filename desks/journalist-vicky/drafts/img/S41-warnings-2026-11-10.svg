<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d">
  <title id="t">IPMA warnings for Lisbon, Wednesday 11 November 2026</title>
  <desc id="d">Red warning for wind 12:00 to 21:00, gusts up to 120 km/h and up to 140 km/h in exposed places; orange for rain 05:00 to 18:00; orange for the sea 12:00 to 21:00. Lisbon time. Source: IPMA open data, read 10 November 2026 at 14:23 UTC.</desc>
  <rect width="800" height="420" fill="#f7f4ee"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="30" y="54" font-size="38" font-weight="700" fill="#1a1a1a">Lisbon, Wednesday 11 Nov</text>
    <text x="30" y="92" font-size="28" fill="#444">IPMA warnings, Lisbon district, local time</text>

    <!-- time axis: 00:00 at x=190, 24:00 at x=770 (24.17 px per hour) -->
    <g font-size="28" fill="#555" text-anchor="middle">
      <text x="190" y="140">00</text>
      <text x="335" y="140">06</text>
      <text x="480" y="140">12</text>
      <text x="625" y="140">18</text>
      <text x="770" y="140" text-anchor="end">24</text>
    </g>
    <g stroke="#d6d0c4" stroke-width="2">
      <line x1="190" y1="150" x2="190" y2="345"/>
      <line x1="335" y1="150" x2="335" y2="345"/>
      <line x1="480" y1="150" x2="480" y2="345"/>
      <line x1="625" y1="150" x2="625" y2="345"/>
      <line x1="770" y1="150" x2="770" y2="345"/>
    </g>

    <text x="30" y="194" font-size="29" font-weight="700" fill="#1a1a1a">Wind</text>
    <rect x="480" y="160" width="217" height="50" rx="7" fill="#c62828"/>
    <text x="588" y="194" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">RED 12-21</text>

    <text x="30" y="258" font-size="29" font-weight="700" fill="#1a1a1a">Rain</text>
    <rect x="311" y="224" width="314" height="50" rx="7" fill="#ef8f00"/>
    <text x="468" y="258" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1a1a">ORANGE 05-18</text>

    <text x="30" y="322" font-size="29" font-weight="700" fill="#1a1a1a">Sea</text>
    <rect x="480" y="288" width="217" height="50" rx="7" fill="#ef8f00"/>
    <text x="588" y="322" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1a1a">ORANGE 12-21</text>

    <text x="30" y="380" font-size="28" font-weight="700" fill="#1a1a1a">Gusts to 120 km/h, 140 where exposed</text>
    <text x="30" y="410" font-size="28" fill="#555">Source: IPMA open data, read 10 Nov, 14:23 UTC</text>
  </g>
</svg>
