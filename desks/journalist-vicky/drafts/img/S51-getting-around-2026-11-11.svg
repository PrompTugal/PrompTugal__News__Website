<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d">
  <title id="t">Getting around Lisbon on Wednesday 11 November 2026</title>
  <desc id="d">Carris: Web Summit shuttle cancelled, disruption possible. Fertagus: 25 de Abril bridge trains suspended if winds pass 90 km/h. Government: alert situation all day; schools closed, outdoor events suspended. Read 11 November 2026 at 03:06 UTC.</desc>
  <rect width="800" height="420" fill="#f7f4ee"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="30" y="54" font-size="36" font-weight="700" fill="#1a1a1a">Lisbon, Wednesday 11 Nov</text>
    <text x="30" y="90" font-size="28" fill="#444">Getting around: what each has said</text>

    <rect x="30" y="112" width="740" height="76" rx="8" fill="#e8e2d6"/>
    <text x="50" y="146" font-size="28" font-weight="700" fill="#1a1a1a">Carris</text>
    <text x="50" y="176" font-size="28" fill="#1a1a1a">Web Summit shuttle cancelled</text>

    <rect x="30" y="200" width="740" height="76" rx="8" fill="#e8e2d6"/>
    <text x="50" y="234" font-size="28" font-weight="700" fill="#1a1a1a">Fertagus</text>
    <text x="50" y="264" font-size="28" fill="#1a1a1a">Bridge trains stop if winds pass 90 km/h</text>

    <rect x="30" y="288" width="740" height="76" rx="8" fill="#c62828"/>
    <text x="50" y="322" font-size="28" font-weight="700" fill="#fff">Government alert, all day</text>
    <text x="50" y="352" font-size="28" fill="#fff">Schools shut, outdoor events off</text>

    <text x="30" y="402" font-size="28" fill="#555">Read 11 Nov, 03:06 UTC, at each source</text>
  </g>
</svg>
