<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 462" width="420" height="462" role="img" aria-label="How the coaches assistant works, in Mastra's account"><style>
.bg{fill:#f6f3ec}.ink{fill:#121317}.ink2{fill:#3f424a}.ink3{fill:#595c64}.rule{stroke:#9d9580}.bar{fill:#006600}.off{fill:#9d9580}.red{fill:#c52830}.grid{stroke:#d8d2c3}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#111214}.ink{fill:#eceae4}.ink2{fill:#c3c0b7}.ink3{fill:#a6a39a}.rule{stroke:#5f5b51}.bar{fill:#6dbb7e}.off{fill:#5f5b51}.red{fill:#f07278}.grid{stroke:#2e2f34}}
.box{fill:#ece7db;stroke:#9d9580}.lim{fill:#f6f3ec;stroke:#c52830}.arr{stroke:#3f424a;fill:none}.ah{fill:#3f424a}@media (prefers-color-scheme:dark){.box{fill:#1a1b1e;stroke:#5f5b51}.lim{fill:#111214;stroke:#f07278}.arr{stroke:#c3c0b7}.ah{fill:#c3c0b7}}</style><rect class="bg" width="420" height="462"/><text class="ink" x="14" y="30" font-size="19" font-weight="700">An agent for NFL coaches</text><text class="ink3" x="14" y="50" font-size="15">Teamworks and PFF, in Mastra's case study</text><rect class="box" x="14" y="70" width="392" height="50" rx="7" stroke-width="1"/><text class="ink" x="28" y="91" font-size="15" font-weight="700">A coach asks a football question</text><text class="ink2" x="28" y="110" font-size="15">in plain language</text><line class="arr" x1="210.0" y1="122" x2="210.0" y2="132" stroke-width="2"/><path class="ah" d="M205.0 131 L215.0 131 L210.0 137 Z"/><rect class="box" x="14" y="138" width="392" height="50" rx="7" stroke-width="1"/><text class="ink" x="28" y="159" font-size="15" font-weight="700">A routing agent sends it on</text><text class="ink2" x="28" y="178" font-size="15">to 7 specialist agents, ~5 tools each</text><line class="arr" x1="210.0" y1="190" x2="210.0" y2="200" stroke-width="2"/><path class="ah" d="M205.0 199 L215.0 199 L210.0 205 Z"/><rect class="box" x="14" y="206" width="392" height="50" rx="7" stroke-width="1"/><text class="ink" x="28" y="227" font-size="15" font-weight="700">The tools query PFF's databases</text><text class="ink2" x="28" y="246" font-size="15">one tool, or two or three agents and tools</text><line class="arr" x1="210.0" y1="258" x2="210.0" y2="268" stroke-width="2"/><path class="ah" d="M205.0 267 L215.0 267 L210.0 273 Z"/><rect class="lim" x="14" y="274" width="392" height="50" rx="7" stroke-width="2"/><text class="ink" x="28" y="295" font-size="15" font-weight="700">A workflow checks the data</text><text class="ink2" x="28" y="314" font-size="15">right data? right filters? nothing lost?</text><line class="arr" x1="210.0" y1="326" x2="210.0" y2="336" stroke-width="2"/><path class="ah" d="M205.0 335 L215.0 335 L210.0 341 Z"/><rect class="box" x="14" y="342" width="392" height="50" rx="7" stroke-width="1"/><text class="ink" x="28" y="363" font-size="15" font-weight="700">The answer goes back</text><text class="ink2" x="28" y="382" font-size="15">slower, but more often right</text><text class="red" x="14" y="420" font-size="15" font-weight="700">Added: one-shot retrieval not reliable enough</text><text class="ink3" x="14" y="440" font-size="15">The red step. Status: staging and internal testing.</text></svg>