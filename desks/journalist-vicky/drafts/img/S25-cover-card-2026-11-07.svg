<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><style>
.bg{fill:#f6f3ec}.ink{fill:#121317}.ink2{fill:#3f424a}.ink3{fill:#595c64}.red{fill:#c52830}.grn{fill:#006600}.box{fill:#ece7db;stroke:#9d9580}.lim{fill:#f6f3ec;stroke:#c52830}.on{fill:#f6f3ec}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#111214}.ink{fill:#eceae4}.ink2{fill:#c3c0b7}.ink3{fill:#a6a39a}.red{fill:#f07278}.grn{fill:#6dbb7e}.box{fill:#1a1b1e;stroke:#5f5b51}.lim{fill:#111214;stroke:#f07278}.on{fill:#111214}}
</style><rect class="bg" width="1200" height="630"/><rect class="grn" x="60" y="44" width="120" height="8"/><text class="ink" x="60" y="118" font-size="76" font-weight="800" text-anchor="start">The sign-in</text><text class="ink3" x="60" y="192" font-size="42" font-weight="400" text-anchor="start">How editors and agents prove who they are</text><rect class="box" x="60" y="234" width="1080" height="76" rx="10" stroke-width="2"/><circle class="grn" cx="104" cy="272" r="24"/><text class="on" x="104" y="286" font-size="36" font-weight="800" text-anchor="middle">1</text><text class="ink" x="148" y="286" font-size="42" font-weight="600" text-anchor="start">The conductor issues a key as a QR code</text><rect class="box" x="60" y="326" width="1080" height="76" rx="10" stroke-width="2"/><circle class="grn" cx="104" cy="364" r="24"/><text class="on" x="104" y="378" font-size="36" font-weight="800" text-anchor="middle">2</text><text class="ink" x="148" y="378" font-size="42" font-weight="600" text-anchor="start">The browser signs a fresh challenge</text><rect class="box" x="60" y="418" width="1080" height="76" rx="10" stroke-width="2"/><circle class="grn" cx="104" cy="456" r="24"/><text class="on" x="104" y="470" font-size="36" font-weight="800" text-anchor="middle">3</text><text class="ink" x="148" y="470" font-size="42" font-weight="600" text-anchor="start">The site checks it against the public key</text><rect class="lim" x="60" y="514" width="1080" height="70" rx="10" stroke-width="3"/><text class="red" x="84" y="563" font-size="42" font-weight="700" text-anchor="start">The limit: the conductor keeps a copy</text></svg>
