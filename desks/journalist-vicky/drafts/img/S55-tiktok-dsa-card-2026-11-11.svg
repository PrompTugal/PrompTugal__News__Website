<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
<title id="t">The EU's preliminary finding on TikTok's For You feed</title>
<desc id="d">A summary card: the European Commission's preliminary finding, 6 November 2026, that TikTok's For You feed breaches the Digital Services Act over the rabbit hole effect. Not a final decision. If confirmed, a fine of up to 6% of worldwide turnover is possible. Source: European Commission.</desc>
<rect width="1200" height="630" fill="#f7f3ea"/>
<rect x="0" y="0" width="1200" height="16" fill="#003399"/>
<text x="60" y="96" font-family="Georgia, serif" font-size="42" fill="#003399">Digital Services Act, preliminary finding</text>
<text x="60" y="206" font-family="Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#1a1a1a">TikTok's For You</text>
<text x="60" y="266" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#1a1a1a">The "rabbit hole" effect, 6 November 2026</text>
<g font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">
<rect x="60" y="306" width="525" height="210" rx="12" fill="#ffffff" stroke="#003399" stroke-width="4"/>
<text x="88" y="372" font-size="40" font-weight="700">Not final</text>
<text x="88" y="422" font-size="38">TikTok can reply</text>
<text x="88" y="470" font-size="38">in writing</text>
<rect x="615" y="306" width="525" height="210" rx="12" fill="#ffffff" stroke="#003399" stroke-width="4"/>
<text x="643" y="372" font-size="40" font-weight="700">Up to 6%</text>
<text x="643" y="422" font-size="38">of worldwide turnover,</text>
<text x="643" y="470" font-size="38">if confirmed</text>
</g>
<text x="60" y="586" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#444">Source: European Commission, IP/26/2361</text>
</svg>
