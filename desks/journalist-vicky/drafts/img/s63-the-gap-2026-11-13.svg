</style><rect class="bg" width="420" height="378"/><text class="ink" x="14" y="30" font-size="19" font-weight="700">Women and tech business</text><text class="ink3" x="14" y="50" font-size="13">In Portugal; bars drawn at 3 times scale</text><text class="ink" x="14" y="84" font-size="15" font-weight="700">Portuguese startups</text><text class="ink2" x="14" y="103" font-size="14">founded or led by women</text><rect class="grid" x="14" y="114" width="392" height="22" rx="4" style="fill:none;stroke-width:1"/><rect class="bar" x="14" y="114" width="164.6" height="22" rx="4"/><text class="ink" x="186.6" y="131" font-size="16" font-weight="700">14%</text><text class="ink" x="14" y="172" font-size="15" font-weight="700">Women in Portugal who would want</text><text class="ink2" x="14" y="191" font-size="14">a tech or IT business</text><rect class="grid" x="14" y="202" width="392" height="22" rx="4" style="fill:none;stroke-width:1"/><rect class="red" x="14" y="202" width="47.0" height="22" rx="4"/><text class="ink" x="69.0" y="219" font-size="16" font-weight="700">4%</text><text class="ink" x="14" y="260" font-size="15" font-weight="700">Men in Portugal who would want</text><text class="ink2" x="14" y="279" font-size="14">a tech or IT business</text><rect class="grid" x="14" y="290" width="392" height="22" rx="4" style="fill:none;stroke-width:1"/><rect class="off" x="14" y="290" width="176.4" height="22" rx="4"/><text class="ink" x="198.4" y="307" font-size="16" font-weight="700">15%</text><text class="ink3" x="14" y="366" font-size="12.5">As PME Magazine reports; Mastercard study, March 2025.</text></svg>