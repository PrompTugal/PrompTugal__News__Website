<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><style>.bg{fill:#f6f3ec}.ink{fill:#121317}.ink3{fill:#595c64}.grn{fill:#006600}.red{fill:#c52830}.box{fill:#ece7db;stroke:#9d9580}.rbox{fill:#f6f3ec;stroke:#c52830}
