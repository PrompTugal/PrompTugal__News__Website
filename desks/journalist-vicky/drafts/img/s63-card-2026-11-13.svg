<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t"><title id="t">Women and tech business in Portugal: 14% of startups founded or led by women; 4% of women and 15% of men would want a tech or IT business, as PME Magazine reports</title><style>.bg{fill:#f6f3ec}.ink{fill:#121317}.ink3{fill:#595c64}.grn{fill:#006600}.red{fill:#c52830}.box{fill:#ece7db;stroke:#9d9580}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#111214}.ink{fill:#eceae4}.ink3{fill:#a6a39a}.grn{fill:#6dbb7e}.red{fill:#f07278}.box{fill:#1a1b1e;stroke:#5f5b51}}</style><rect class="bg" width="1200" height="630"/><rect class="grn" x="60" y="36" width="120" height="8"/><text class="ink" x="60" y="98" font-size="56" font-weight="800" text-anchor="start">Women and tech business</text><text class="ink3" x="60" y="150" font-size="42" font-weight="400" text-anchor="start">In Portugal, as PME Magazine reports</text><rect class="box" x="60" y="178" width="1080" height="104" rx="14" stroke-width="2"/><text class="grn" x="96" y="250" font-size="64" font-weight="800" text-anchor="start">14%</text><text class="ink" x="290" y="244" font-size="42" font-weight="600" text-anchor="start">of startups founded or led by women</text><rect class="box" x="60" y="298" width="1080" height="104" rx="14" stroke-width="2"/><text class="red" x="96" y="370" font-size="64" font-weight="800" text-anchor="start">4%</text><text class="ink" x="290" y="364" font-size="42" font-weight="600" text-anchor="start">of women would want a tech business</text><rect class="box" x="60" y="418" width="1080" height="104" rx="14" stroke-width="2"/><text class="ink" x="96" y="490" font-size="64" font-weight="800" text-anchor="start">15%</text><text class="ink" x="290" y="484" font-size="42" font-weight="600" text-anchor="start">of men would want a tech business</text><text class="ink3" x="60" y="610" font-size="42" font-weight="400" text-anchor="start">Mastercard study, March 2025, via PME Magazine.</text></svg>
