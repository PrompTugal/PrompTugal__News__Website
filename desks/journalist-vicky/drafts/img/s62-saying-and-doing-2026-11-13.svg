</style><rect class="bg" width="420" height="378"/><text class="ink" x="14" y="30" font-size="19" font-weight="700">Saying it and doing it</text><text class="ink3" x="14" y="50" font-size="13">AI news summaries, UK adults, BBC and Ipsos, 2025</text><text class="ink" x="14" y="84" font-size="15" font-weight="700">Say it is important to watch</text><text class="ink2" x="14" y="103" font-size="14">for errors in AI content</text><rect class="grid" x="14" y="114" width="392" height="22" rx="4" fill="none" style="fill:none;stroke-width:1"/><rect class="bar" x="14" y="114" width="250.9" height="22" rx="4"/><text class="ink" x="272.9" y="131" font-size="16" font-weight="700">64%</text><text class="ink" x="14" y="172" font-size="15" font-weight="700">Would instinctively question</text><text class="ink2" x="14" y="191" font-size="14">an AI-generated summary</text><rect class="grid" x="14" y="202" width="392" height="22" rx="4" fill="none" style="fill:none;stroke-width:1"/><rect class="red" x="14" y="202" width="149.0" height="22" rx="4"/><text class="ink" x="171.0" y="219" font-size="16" font-weight="700">38%</text><text class="ink" x="14" y="260" font-size="15" font-weight="700">Of leading assistants' news answers</text><text class="ink2" x="14" y="279" font-size="14">had a significant error (BBC and EBU)</text><rect class="grid" x="14" y="290" width="392" height="22" rx="4" fill="none" style="fill:none;stroke-width:1"/><rect class="off" x="14" y="290" width="176.4" height="22" rx="4"/><text class="ink" x="198.4" y="307" font-size="16" font-weight="700">45%</text><text class="ink3" x="14" y="366" font-size="12.5">First two: survey of 2,000 UK adults, May 2025.</text></svg>