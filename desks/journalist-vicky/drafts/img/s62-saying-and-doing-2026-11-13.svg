<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 378" width="420" height="378" role="img" aria-label="64 per cent of UK adults say watching for errors in AI content matters, but 38 per cent would question an AI summary; the BBC and EBU found a significant error in 45 per cent of news answers"><style>
