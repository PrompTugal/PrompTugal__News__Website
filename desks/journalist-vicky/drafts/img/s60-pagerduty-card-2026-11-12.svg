<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t"><title id="t">Five problems PagerDuty names in running AI agents in production, and what it did about each, in its own account</title><style>.bg{fill:#f6f3ec}.ink{fill:#121317}.ink3{fill:#595c64}.grn{fill:#006600}.red{fill:#c52830}.box{fill:#ece7db;stroke:#9d9580}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#111214}.ink{fill:#eceae4}.ink3{fill:#a6a39a}.grn{fill:#6dbb7e}.red{fill:#f07278}.box{fill:#1a1b1e;stroke:#5f5b51}}</style><rect class="bg" width="1200" height="630"/><rect class="grn" x="60" y="36" width="120" height="8"/><text class="ink" x="60" y="96" font-size="56" font-weight="800" text-anchor="start">AI agents in production</text><text class="ink3" x="60" y="148" font-size="42" font-weight="400" text-anchor="start">PagerDuty, in its own account</text><rect class="box" x="60" y="176" width="1080" height="74" rx="12" stroke-width="2"/><text class="red" x="84" y="227" font-size="42" font-weight="700" text-anchor="start">Answers that vary</text><text class="ink3" x="572" y="227" font-size="42" font-weight="700" text-anchor="middle">→</text><text class="ink" x="604" y="227" font-size="42" font-weight="600" text-anchor="start">Limits on inputs, tools</text><rect class="box" x="60" y="264" width="1080" height="74" rx="12" stroke-width="2"/><text class="red" x="84" y="315" font-size="42" font-weight="700" text-anchor="start">Context fatigue</text><text class="ink3" x="572" y="315" font-size="42" font-weight="700" text-anchor="middle">→</text><text class="ink" x="604" y="315" font-size="42" font-weight="600" text-anchor="start">Smaller agents by domain</text><rect class="box" x="60" y="352" width="1080" height="74" rx="12" stroke-width="2"/><text class="red" x="84" y="403" font-size="42" font-weight="700" text-anchor="start">Errors that compound</text><text class="ink3" x="572" y="403" font-size="42" font-weight="700" text-anchor="middle">→</text><text class="ink" x="604" y="403" font-size="42" font-weight="600" text-anchor="start">Traces, evals, CI gates</text><rect class="box" x="60" y="440" width="1080" height="74" rx="12" stroke-width="2"/><text class="red" x="84" y="491" font-size="42" font-weight="700" text-anchor="start">Prompt injection</text><text class="ink3" x="572" y="491" font-size="42" font-weight="700" text-anchor="middle">→</text><text class="ink" x="604" y="491" font-size="42" font-weight="600" text-anchor="start">Guardrails at two layers</text><rect class="box" x="60" y="528" width="1080" height="74" rx="12" stroke-width="2"/><text class="red" x="84" y="579" font-size="42" font-weight="700" text-anchor="start">Poor data, stale facts</text><text class="ink3" x="572" y="579" font-size="42" font-weight="700" text-anchor="middle">→</text><text class="ink" x="604" y="579" font-size="42" font-weight="600" text-anchor="start">Memory that tracks time</text></svg>
