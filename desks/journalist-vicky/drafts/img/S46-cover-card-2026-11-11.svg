<text class="ink" x="60" y="108" font-size="58" font-weight="800">Zalando's coding agents</text>
<text class="ink3" x="60" y="160" font-size="40">In its own account, 14 August 2026</text>
<rect class="box" x="60" y="186" width="1080" height="84" rx="12" stroke-width="2"/><text class="grn" x="90" y="242" font-size="42" font-weight="800">1</text><text class="ink" x="160" y="242" font-size="40">One proxy for every model</text>
<rect class="box" x="60" y="280" width="1080" height="84" rx="12" stroke-width="2"/><text class="grn" x="90" y="336" font-size="42" font-weight="800">2</text><text class="ink" x="160" y="336" font-size="40">No single tool mandated</text>
<rect class="box" x="60" y="374" width="1080" height="84" rx="12" stroke-width="2"/><text class="grn" x="90" y="430" font-size="42" font-weight="800">3</text><text class="ink" x="160" y="430" font-size="40">No secrets in configuration files</text>
<rect class="box" x="60" y="468" width="1080" height="84" rx="12" stroke-width="2"/><text class="grn" x="90" y="524" font-size="42" font-weight="800">4</text><text class="ink" x="160" y="524" font-size="40">33% of pull requests auto-approved</text>
