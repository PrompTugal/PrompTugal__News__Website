<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t"><title id="t">Zalando's approach to AI coding agents, in its own account: one proxy for every model, no mandated tool, no secrets in configuration files, a third of pull requests auto-approved as low risk</title><style>
