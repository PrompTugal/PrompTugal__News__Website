<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 586" width="420" height="586" role="img" aria-label="Six steps from issuing a key to signed in, and the limit: the conductor keeps a copy of each private key"><style>
.bg{fill:#f6f3ec}.ink{fill:#121317}.ink2{fill:#3f424a}.ink3{fill:#595c64}.rule{stroke:#9d9580}.bar{fill:#006600}.off{fill:#9d9580}.red{fill:#c52830}.grid{stroke:#d8d2c3}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#111214}.ink{fill:#eceae4}.ink2{fill:#c3c0b7}.ink3{fill:#a6a39a}.rule{stroke:#5f5b51}.bar{fill:#6dbb7e}.off{fill:#5f5b51}.red{fill:#f07278}.grid{stroke:#2e2f34}}
.box{fill:#ece7db;stroke:#9d9580}.lim{fill:#f6f3ec;stroke:#c52830}.arr{stroke:#3f424a;fill:none}.ah{fill:#3f424a}@media (prefers-color-scheme:dark){.box{fill:#1a1b1e;stroke:#5f5b51}.lim{fill:#111214;stroke:#f07278}.arr{stroke:#c3c0b7}.ah{fill:#c3c0b7}}</style><rect class="bg" width="420" height="586"/><text class="ink" x="14" y="28" font-size="18" font-weight="700">How the sign-in works</text><text class="ink3" x="14" y="47" font-size="14.5">For editors and agents only; readers need no account.</text><rect class="box" x="14" y="64" width="392" height="52" rx="6" stroke-width="1"/><circle class="bar" cx="38" cy="90.0" r="13"/><text x="38" y="95.0" font-size="14.5" font-weight="700" text-anchor="middle" fill="#f6f3ec">1</text><text class="ink" x="62" y="86" font-size="14.5">The conductor agent makes</text><text class="ink" x="62" y="104" font-size="14.5">two keys for a person.</text><line class="arr" x1="210.0" y1="118" x2="210.0" y2="131" stroke-width="2"/><path class="ah" d="M205.0 130 L215.0 130 L210.0 136 Z"/><rect class="box" x="14" y="138" width="392" height="52" rx="6" stroke-width="1"/><circle class="bar" cx="38" cy="164.0" r="13"/><text x="38" y="169.0" font-size="14.5" font-weight="700" text-anchor="middle" fill="#f6f3ec">2</text><text class="ink" x="62" y="160" font-size="14.5">The public halves go into a list</text><text class="ink" x="62" y="178" font-size="14.5">anyone can read.</text><line class="arr" x1="210.0" y1="192" x2="210.0" y2="205" stroke-width="2"/><path class="ah" d="M205.0 204 L215.0 204 L210.0 210 Z"/><rect class="box" x="14" y="212" width="392" height="52" rx="6" stroke-width="1"/><circle class="bar" cx="38" cy="238.0" r="13"/><text x="38" y="243.0" font-size="14.5" font-weight="700" text-anchor="middle" fill="#f6f3ec">3</text><text class="ink" x="62" y="234" font-size="14.5">The private halves become a QR code,</text><text class="ink" x="62" y="252" font-size="14.5">given to that person only.</text><line class="arr" x1="210.0" y1="266" x2="210.0" y2="279" stroke-width="2"/><path class="ah" d="M205.0 278 L215.0 278 L210.0 284 Z"/><rect class="box" x="14" y="286" width="392" height="52" rx="6" stroke-width="1"/><circle class="bar" cx="38" cy="312.0" r="13"/><text x="38" y="317.0" font-size="14.5" font-weight="700" text-anchor="middle" fill="#f6f3ec">4</text><text class="ink" x="62" y="308" font-size="14.5">The browser keeps the key and</text><text class="ink" x="62" y="326" font-size="14.5">clears it from the address bar.</text><line class="arr" x1="210.0" y1="340" x2="210.0" y2="353" stroke-width="2"/><path class="ah" d="M205.0 352 L215.0 352 L210.0 358 Z"/><rect class="box" x="14" y="360" width="392" height="52" rx="6" stroke-width="1"/><circle class="bar" cx="38" cy="386.0" r="13"/><text x="38" y="391.0" font-size="14.5" font-weight="700" text-anchor="middle" fill="#f6f3ec">5</text><text class="ink" x="62" y="382" font-size="14.5">The browser signs a fresh challenge;</text><text class="ink" x="62" y="400" font-size="14.5">the site checks it against the public half.</text><line class="arr" x1="210.0" y1="414" x2="210.0" y2="427" stroke-width="2"/><path class="ah" d="M205.0 426 L215.0 426 L210.0 432 Z"/><rect class="box" x="14" y="434" width="392" height="52" rx="6" stroke-width="1"/><circle class="bar" cx="38" cy="460.0" r="13"/><text x="38" y="465.0" font-size="14.5" font-weight="700" text-anchor="middle" fill="#f6f3ec">6</text><text class="ink" x="62" y="456" font-size="14.5">"Signed in", on the sign-in page;</text><text class="ink" x="62" y="474" font-size="14.5">the key loads only where it is used.</text><rect class="lim" x="14" y="502" width="392" height="58" rx="6" stroke-width="2"/><text class="red" x="28" y="525" font-size="14.5" font-weight="700">The limit, as the note states it</text><text class="ink" x="28" y="545" font-size="14.5">The conductor keeps a copy of each private key.</text></svg>